[project]
name = "hiver-email"
version = "0.1.0"
description = "AI suggested-email-response system with a retrieval-grounded generator and a two-signal evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiver_email"]

# --- 16 GB CPU-only development -------------------------------------------
# sentence-transformers pulls torch. Force the CPU-only wheel so we do not
# download ~2.5 GB of CUDA runtime that this machine cannot use anyway.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
